[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "posthog-instantly-attribution"
version = "0.1.0"
description = "Daily job to attribute PostHog trial signups to Instantly"
requires-python = ">=3.11"
# tested on 3.14
dependencies = [
    "httpx==0.28.1",
]

[project.scripts]
posthog-instantly-attribution = "posthog_instantly_attribution.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/posthog_instantly_attribution"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
